version: 2

models:
  - name: s_encounters
    
    columns:
      - name: encounter_id
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: encounter_start_date
        data_type: date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= encounter_end_date"
              config: 
                store_failures: true

      - name: encounter_start_time
        data_type: string
        data_tests:
          - not_null

      - name: encounter_end_date
        data_type: date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= encounter_start_date"
              config: 
                store_failures: true

      - name: encounter_end_time
        data_type: string

      - name: patient_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_patients')
                field: id

      - name: length_of_stay_mins
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config: 
                store_failures: true
        
      - name: length_of_stay_days
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config: 
                store_failures: true
        
      - name: organization_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_organizations')
                field: id
        
      - name: provider_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_providers')
                field: id
        
      - name: payer_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_payers')
                field: id
        
      - name: encounter_class
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['Ambulatory', 'Wellness', 'Outpatient', 'Urgent Care', 'Emergency', 'Inpatient']
        
      - name: base_encounter_cost
        data_type: double
        
      - name: total_claim_cost
        data_type: double
        
      - name: payer_coverage
        data_type: double
        
      - name: encounter_reason
        data_type: string
        
      - name: had_an_allergy
        data_type: int
        
      - name: number_of_allergies
        data_type: bigint
        
      - name: had_a_careplan
        data_type: int
        
      - name: number_of_careplans
        data_type: bigint
        
      - name: had_a_condition
        data_type: int
        
      - name: number_of_conditions
        data_type: bigint
        
      - name: used_a_device
        data_type: int
        
      - name: device_name
        data_type: string
        
      - name: had_an_immunization
        data_type: int
        
      - name: number_of_immunizations
        data_type: bigint
        
      - name: total_cost_of_immunizations
        data_type: double
        
      - name: had_a_procedure
        data_type: int
        
      - name: number_of_procedures
        data_type: bigint
        
      - name: total_cost_of_procedures
        data_type: double

      - name: admitted_within_10d
        data_type: string

      - name: admitted_within_10d_reason
        data_type: string

      - name: admitted_within_10d_start_date
        data_type: date

      - name: admitted_within_10d_start_time
        data_type: string

      - name: encounter_billing_type
        data_type: string

unit_tests:
  - name: test_admitted_within_10d
    model: s_encounters
    given:
      - input: source('bronze', 'encounters')
        rows:
          - {Id: e1, PATIENT: p1, ENCOUNTERCLASS: ambulatory, START: "2024-01-01 09:00:00"}
          - {Id: e2, PATIENT: p1, ENCOUNTERCLASS: inpatient,  START: "2024-01-11 09:00:00"}
          - {Id: e3, PATIENT: p1, ENCOUNTERCLASS: inpatient,  START: "2024-01-03 09:00:00"}
          - {Id: e4, PATIENT: p2, ENCOUNTERCLASS: ambulatory, START: "2024-01-01 09:00:00"}
          - {Id: e5, PATIENT: p1, ENCOUNTERCLASS: inpatient,  START: "2024-01-05 09:00:00"}
          - {Id: e6, PATIENT: p2, ENCOUNTERCLASS: inpatient, START: "2024-01-11 09:00:00"}
      - input: source('bronze', 'allergies')
        rows: []
      - input: source('bronze', 'careplans')
        rows: []
      - input: source('bronze', 'conditions')
        rows: []
      - input: source('bronze', 'devices')
        rows: []
      - input: source('bronze', 'immunizations')
        rows: []
      - input: source('bronze', 'procedures')
        rows: []
    expect:
      rows:
        - {encounter_id: e1, admitted_within_10d: '1', admitted_within_10d_start_date: "2024-01-03"}
        - {encounter_id: e2, admitted_within_10d: 'NA'}
        - {encounter_id: e3, admitted_within_10d: 'NA'}
        - {encounter_id: e4, admitted_within_10d: '1', admitted_within_10d_start_date: "2024-01-11"}
        - {encounter_id: e5, admitted_within_10d: 'NA'}
        - {encounter_id: e6, admitted_within_10d: 'NA'}