version: 2

models:
  - name: s_encounter_journeys
    description: |
      One row per encounter, with the journey that encounter belongs to.
      enc_id is unique. Child tables (conditions, procedures and so on) join to
      this model on enc_id, so every child event inherits its encounter's journey.

      How journeys are built:
      1. Base journeys: every non-follow-up encounter starts a new journey for
         the patient. A follow-up is any encounter whose description contains
         "follow-up", and it inherits the previous encounter's journey.
         Encounters with the same start timestamp get the same number.
      2. Merging: non-follow-up encounters with the same reason code that start
         within 180 days of each other are merged into the earliest journey
         (the later one points back to it). A gap over 180 days starts a new
         journey, so recurrences stay separate.
      3. Renumbering: the final journeys are numbered 1, 2, 3 per patient with
         no gaps (jny_seq_no).

      Other derived fields:
      - is_admission_within_10d: whether a non-inpatient encounter was followed
        by an inpatient admission within 10 days, with details of the first one.
      - enc_billing_type: FPP when the payer covered part of the cost and the
        encounter has a procedure, otherwise Per Diem.

      Assumptions and limits:
      - Follow-ups are detected from the description text, not a coded field.
      - The 180-day merge window is a tunable choice.
      - jny_id is derived from jny_seq_no and patient_id, so it can change if
        earlier encounters are added or corrected later.

    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "jny_seq_no <= base_journey_seq_no"
          config:
            store_failures: true

    columns:
      - name: jny_id
        data_type: string
        description: "Journey key (MD5 of jny_seq_no and patient_id). Repeats across all encounters in the same journey."
        data_tests:
          - not_null

      - name: jny_seq_no
        data_type: int
        description: "Final journey number for the patient (1, 2, 3...) in time order, after follow-ups are attached and same-reason journeys are merged."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
              config:
                store_failures: true

      - name: base_journey_seq_no
        data_type: bigint
        description: "Journey number before merging by reason code. Counts non-follow-up encounters per patient, so numbers can skip when encounters share a start time."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 1"
              config:
                store_failures: true

      - name: patient_id
        data_type: string
        description: "Patient the encounter belongs to."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('s_patients')
                field: id

      - name: enc_id
        data_type: string
        description: "Encounter identifier. Unique in this model."
        data_tests:
          - unique
          - not_null

      - name: provider_id
        data_type: string
        description: "Provider who delivered the encounter."
        data_tests:
          - relationships:
              arguments:
                to: ref('s_providers')
                field: id

      - name: organization_id
        data_type: string
        description: "Organization (hospital or clinic) where the encounter took place."
        data_tests:
          - relationships:
              arguments:
                to: ref('s_organizations')
                field: id

      - name: payer_id
        data_type: string
        description: "Payer on the encounter."
        data_tests:
          - relationships:
              arguments:
                to: ref('s_payers')
                field: id

      - name: enc_start_ts
        data_type: timestamp_ltz
        description: "Encounter start timestamp."
        data_tests:
          - not_null

      - name: enc_start_date
        data_type: date
        description: "Encounter start date."
        data_tests:
          - not_null

      - name: enc_start_time
        data_type: string
        description: "Encounter start time (HH:mm:ss)."

      - name: enc_end_ts
        data_type: timestamp_ltz
        description: "Encounter end timestamp."

      - name: enc_end_date
        data_type: date
        description: "Encounter end date."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= enc_start_date"
              config:
                store_failures: true

      - name: enc_end_time
        data_type: string
        description: "Encounter end time (HH:mm:ss)."

      - name: enc_class
        data_type: string
        description: "Encounter class, such as Wellness, Ambulatory or Inpatient."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Ambulatory', 'Wellness', 'Outpatient', 'Urgent Care', 'Emergency', 'Inpatient']

      - name: enc_reason_code
        data_type: string
        description: "Coded reason for the encounter. Used to merge journeys. Often null for wellness and routine visits."

      - name: enc_reason
        data_type: string
        description: "Reason for the encounter (description), whitespace cleaned."

      - name: enc_code
        data_type: string
        description: "Code for the encounter type."

      - name: enc_description
        data_type: string
        description: "Description of the encounter type, whitespace cleaned. Follow-ups are detected from this text."

      - name: base_enc_cost
        data_type: double
        description: "Base cost of the encounter."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                store_failures: true

      - name: total_claim_cost
        data_type: double
        description: "Total claim cost for the encounter."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                store_failures: true

      - name: payer_coverage
        data_type: double
        description: "Amount covered by the payer."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                store_failures: true

      - name: patient_responsibility
        data_type: double
        description: "Amount the patient owes (total claim cost minus payer coverage)."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                severity: warn
                store_failures: true

      - name: enc_billing_type
        data_type: string
        description: "FPP if the payer covered part of the cost and the encounter has a procedure, otherwise Per Diem."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FPP', 'Per Diem']

      - name: is_follow_up
        data_type: int
        description: "1 if the encounter description contains 'follow-up', else 0. Follow-ups join the previous encounter's journey."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: days_since_previous_encounter
        data_type: bigint
        description: "Days since the patient's previous encounter, across all journeys. NULL for the first encounter."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config:
                store_failures: true

      - name: is_admission_within_10d
        data_type: string
        description: "Y if an inpatient admission started within 10 days of this encounter, N if not, NA when the encounter is itself inpatient."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N', 'NA']

      - name: admitted_within_10d_reason
        data_type: string
        description: "Reason (or description) of the first inpatient admission within 10 days. NULL when there is none."

      - name: admitted_within_10d_start_date
        data_type: date
        description: "Start date of that admission."
        data_tests:
          - not_null:
              config:
                where: "is_admission_within_10d = 'Y'"

      - name: admitted_within_10d_start_time
        data_type: string
        description: "Start time of that admission (HH:mm:ss)."

  - name: s_encounters
    
    columns:
      - name: enc_id
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: enc_start_date
        data_type: date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= enc_end_date"
              config: 
                store_failures: true

      - name: enc_start_time
        data_type: string
        data_tests:
          - not_null

      - name: enc_end_date
        data_type: date
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= enc_start_date"
              config: 
                store_failures: true

      - name: enc_end_time
        data_type: string

      - name: patient_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_patients')
                field: id

      - name: length_of_stay_mins
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config: 
                store_failures: true
        
      - name: length_of_stay_days
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
              config: 
                store_failures: true
        
      - name: organization_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_organizations')
                field: id
        
      - name: provider_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_providers')
                field: id
        
      - name: payer_id
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('s_payers')
                field: id
        
      - name: encounter_class
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['Ambulatory', 'Wellness', 'Outpatient', 'Urgent Care', 'Emergency', 'Inpatient']
        
      - name: base_encounter_cost
        data_type: double
        
      - name: total_claim_cost
        data_type: double
        
      - name: payer_coverage
        data_type: double

      - name: code
        data_type: string

      - name: encounter_description
        data_type: string
        
      - name: reason_code
        data_type: string
      
      - name: encounter_reason
        data_type: string
        
      - name: had_an_allergy
        data_type: int
        
      - name: number_of_allergies
        data_type: bigint
        
      - name: had_a_careplan
        data_type: int
        
      - name: number_of_careplans
        data_type: bigint
        
      - name: had_a_condition
        data_type: int
        
      - name: number_of_conditions
        data_type: bigint
        
      - name: used_a_device
        data_type: int
        
      - name: device_name
        data_type: string
        
      - name: had_an_immunization
        data_type: int
        
      - name: number_of_immunizations
        data_type: bigint
        
      - name: total_cost_of_immunizations
        data_type: double
        
      - name: had_a_procedure
        data_type: int
        
      - name: number_of_procedures
        data_type: bigint
        
      - name: total_cost_of_procedures
        data_type: double

      - name: admitted_within_10d
        data_type: string

      - name: admitted_within_10d_reason
        data_type: string

      - name: admitted_within_10d_start_date
        data_type: date

      - name: admitted_within_10d_start_time
        data_type: string

      - name: encounter_billing_type
        data_type: string

unit_tests:
  - name: test_journey_numbering
    model: s_encounter_journeys
    given:
      - input: source('bronze', 'encounters')
        rows:
          - {id: e1, patient: p1, start: "2024-01-01 09:00:00", encounterclass: ambulatory, description: Encounter for symptom, reasoncode: 100}
          - {id: e2, patient: p1, start: "2024-01-15 09:00:00", encounterclass: ambulatory, description: Follow-up encounter, reasoncode: 100}
          - {id: e3, patient: p1, start: "2024-02-01 09:00:00", encounterclass: wellness, description: General examination of patient (procedure)}
          - {id: e4, patient: p1, start: "2024-03-01 09:00:00", encounterclass: ambulatory, description: Encounter for symptom, reasoncode: 100}
          - {id: e5, patient: p1, start: "2025-01-01 09:00:00", encounterclass: ambulatory, description: Encounter for symptom, reasoncode: 100}
      - input: source('bronze', 'procedures')
        rows: []
    expect:
      rows:
        - {enc_id: e1, jny_seq_no: 1, is_follow_up: 0}
        - {enc_id: e2, jny_seq_no: 1, is_follow_up: 1}
        - {enc_id: e3, jny_seq_no: 2, is_follow_up: 0}
        - {enc_id: e4, jny_seq_no: 1, is_follow_up: 0}
        - {enc_id: e5, jny_seq_no: 3, is_follow_up: 0}

  - name: test_admitted_within_10d
    model: s_encounter_journeys
    given:
      - input: source('bronze', 'encounters')
        rows:
          - {Id: e1, PATIENT: p1, ENCOUNTERCLASS: ambulatory, START: "2024-01-01 09:00:00"}
          - {Id: e2, PATIENT: p1, ENCOUNTERCLASS: inpatient,  START: "2024-01-11 09:00:00"}
          - {Id: e3, PATIENT: p1, ENCOUNTERCLASS: inpatient,  START: "2024-01-03 09:00:00"}
          - {Id: e4, PATIENT: p2, ENCOUNTERCLASS: ambulatory, START: "2024-01-01 09:00:00"}
          - {Id: e5, PATIENT: p1, ENCOUNTERCLASS: inpatient,  START: "2024-01-05 09:00:00"}
          - {Id: e6, PATIENT: p2, ENCOUNTERCLASS: inpatient, START: "2024-01-11 09:00:00"}
      - input: source('bronze', 'procedures')
        rows: []
    expect:
      rows:
        - {enc_id: e1, is_admission_within_10d: 'Y', admitted_within_10d_start_date: "2024-01-03"}
        - {enc_id: e2, is_admission_within_10d: 'NA'}
        - {enc_id: e3, is_admission_within_10d: 'NA'}
        - {enc_id: e4, is_admission_within_10d: 'Y', admitted_within_10d_start_date: "2024-01-11"}
        - {enc_id: e5, is_admission_within_10d: 'NA'}
        - {enc_id: e6, is_admission_within_10d: 'NA'}