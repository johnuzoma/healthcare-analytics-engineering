version: 2

models:
  - name: fct_encounters
    description: |
      The table captures encounter data related to patients within the healthcare system. 
      It includes details such as the patient ID, encounter date, specific codes, and descriptions 
      related to the nature of the encounter and the reasons for it. This table can be useful for 
      analyzing patient interactions, tracking health outcomes, and conducting research on encounter patterns.
    columns:
      - name: encounter_id
        data_type: string
        description: ""

      - name: encounter_start_date
        data_type: date
        description: ""

      - name: encounter_start_time
        data_type: string
        description: ""

      - name: encounter_end_date
        data_type: date
        description: ""

      - name: encounter_end_time
        data_type: string
        description: ""

      - name: patient_id
        data_type: string
        description: ""

      - name: length_of_stay_mins
