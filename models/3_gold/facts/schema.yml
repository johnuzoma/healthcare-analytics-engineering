  - name: fct_medications
    description: |
      The table contains data related to medications prescribed to patients. 
      It includes information such as the start and stop dates of medication, 
      patient identifiers, and descriptions of the medications. 
      This data can be used for tracking medication usage, analyzing treatment plans, 
      and understanding patient encounters related to medication management."
