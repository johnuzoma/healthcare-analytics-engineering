        description: ""

      - name: length_of_stay_days
        data_type: bigint
        description: ""

      - name: organization_id
        data_type: string
        description: ""

      - name: provider_id
        data_type: string
        description: ""

      - name: payer_id
        data_type: string
        description: ""

      - name: encounter_class
        data_type: string
        description: ""

      - name: base_encounter_cost
