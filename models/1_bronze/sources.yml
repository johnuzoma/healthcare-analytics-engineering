version: 2

sources:
  - name: bronze
    database: synthea
    schema: 1_bronze
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
      loaded_at_field: loaded_at
    tables:
      - name: allergies
      - name: careplans
      - name: claims
      - name: claims_transactions
      - name: conditions
      - name: devices
      - name: encounters
        config:
          freshness: # make this a little more strict
            warn_after: {count: 6, period: hour}
            error_after: {count: 12, period: hour}
        columns:
          - name: id
            description: Primary key of the encounters table
            data_tests:
              - unique
              - not_null
      - name: imaging_studies
        config:
          freshness: null # do not check freshness for this table
      - name: immunizations
      - name: medications
      - name: observations
      - name: organizations
      - name: patients
      - name: payer_transitions
      - name: payers
      - name: procedures
      - name: providers
      - name: supplies 