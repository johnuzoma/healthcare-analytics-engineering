version: 2

sources:
  - name: bronze
    database: synthea_ehr
    schema: 1_bronze
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
      loaded_at_field: loaded_at
    tables:
      - name: encounters
        columns:
          - name: id
            description: Primary key of the encounters table
            data_tests:
              - unique
              - not_null

      - name: medications
      - name: allergies
      - name: careplans
      - name: conditions
      - name: devices
      - name: imaging_studies
      - name: immunizations
      - name: observations
      - name: organizations
      - name: patients
      - name: payer_transitions
      - name: payers
      - name: procedures
      - name: providers      